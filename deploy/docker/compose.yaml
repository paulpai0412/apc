name: apc
services:
  hmi:
    image: ${APC_IMAGE:?Set APC_IMAGE to the tested ghcr.io/paulpai0412/apc@sha256 digest}
    platform: linux/arm64
    ports:
      - "127.0.0.1:18082:3000"
    volumes:
      - apc-data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=268435456
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: false
    restart: unless-stopped
    stop_grace_period: 45s
    pids_limit: 512
    mem_limit: 6g
    cpus: 2
    networks: [isolated]
volumes:
  apc-data:
networks:
  isolated:
    internal: true
