name: apc
services:
  hmi:
    image: ${APC_IMAGE:?Set APC_IMAGE to the tested ghcr.io/paulpai0412/apc@sha256 digest}
    platform: linux/arm64
    volumes:
      - apc-data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=268435456
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: false
    restart: unless-stopped
    stop_grace_period: 45s
    pids_limit: 512
    mem_limit: 6g
    cpus: 2
    networks: [isolated]
  gateway:
    # Same image/digest, only a fixed TCP relay. The HMI has no external network.
    image: ${APC_IMAGE:?Set APC_IMAGE to the tested ghcr.io/paulpai0412/apc@sha256 digest}
    platform: linux/arm64
    entrypoint: ["/usr/bin/tini", "--", "python3", "/app/container/loopback-proxy.py"]
    depends_on:
      hmi:
        condition: service_healthy
    ports:
      - "127.0.0.1:18082:3000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16777216
      - /data:mode=0700,uid=10001,gid=10001,size=1048576
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 5s
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    networks: [ingress, isolated]
    healthcheck:
      test: ["CMD", "python3", "/app/container/proxy-health.py"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  apc-data:
networks:
  isolated:
    internal: true
  ingress:
    driver: bridge
