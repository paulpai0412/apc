    initialValue: 0
  - nodeId: "VP_PassBalancing:ObjectiveFunction"
    nodeClass: "Variable"
    dataType: "Double"
    initialValue: 0
  - nodeId: "VP_PassBalancing:AcquisitionSequence"
    nodeClass: "Variable"
    dataType: "Double"
    initialValue: 0
    comment: "Simulator-owned odd/even complete-frame counter; static zero is not fresh"
  - nodeId: "VP_PassBalancing:ControlObservation"
    nodeClass: "Variable"
    dataType: "String"
    initialValue: ""
    comment: "Engine measured-performance JSON; advisory, not command authority"
  - nodeId: "VP_PassBalancing:ConfigurationStatus"
