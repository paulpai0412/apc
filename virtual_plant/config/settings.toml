[opcua]
endpoint_url = "opc.tcp://localhost:4855"
security_policy = "Basic256Sha256"
message_mode = "SignAndEncrypt"
namespace_index = 2

[acquisition]
# Required namespace-2 String IDs matching selected model metadata.name.
# One simulator owns these counters. Provision writable Double nodes, initially 0.
# Missing nodes or failed/unknown frame writes stop publication; no fake freshness.
debutanizer = "VP_Debutanizer:AcquisitionSequence"
cstr = "VP_CSTR:AcquisitionSequence"
pass_balancing = "VP_PassBalancing:AcquisitionSequence"
# Feedback nodes published by this simulator:
# Reflux/Steam/CSTR_Cooling/FC1_Bias..FC6_Bias:AppliedSP (MV node_ids.applied_sp).
# Feed_Flow/CSTR_Feed:AcquiredPV (DV node_ids.pv); original :PV remains command input.
# No SP, Mode, ModeTarget, target, tuning, or limit is initialized by the simulator.

[identity]
app_name = "AuTHRity Virtual Plant"
app_uri = "urn:authrity:virtual-plant"
auto_create_keys = true
trust_server_certs = true

[auth]
mode = "username" # "username" | "x509"
username = "virtual_plant"
password = "password"

[runtime]
# Simulation speed multiplier (10 = 10x real-time)
speed_multiplier = 10
reconnect_delay_sec = 5
cycle_time_ms = 1000

[debutanizer]
num_stages = 12
feed_stage = 6
relative_volatility = 2.2
hold_up_molar = 15000.0
dt_seconds = 1.0

[cstr]
# CSTR uses default initialization

[paths]
# Relative to executable
pki_dir = "pki"
cert_path = "pki/own/cert.der"
key_path = "pki/own/private.pem"